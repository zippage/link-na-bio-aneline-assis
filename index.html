<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Aneline Assis | Neuropsicopedagoga Clínica</title>
<meta name="description" content="Atendimento baseado em evidência científica para crianças e adolescentes com dificuldade de aprendizagem. Agende pelo WhatsApp.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --verde: #0E3B27;
    --verde-escuro: #08281A;
    --verde-linha: #0E3B2710;
    --dourado: #C89A2C;
    --dourado-claro: #E0A81A;
    --branco: #FFFFFF;
    --off: #FFFFFF;
    --texto: #101512;
    --texto-suave: #101512;
    --sombra: 0 12px 32px -12px rgba(11,61,40,0.16);
    --sombra-suave: 0 4px 14px -6px rgba(11,61,40,0.10);
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }

  html{-webkit-text-size-adjust:100%;}

  body{
    font-family:'Poppins', sans-serif;
    background: var(--off);
    color:var(--texto);
    min-height:100dvh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  /* watermark assinatura da marca */
  .watermark{
    position:fixed;
    top:6%;
    right:-14%;
    width:56vw;
    max-width:320px;
    opacity:0.07;
    pointer-events:none;
    z-index:0;
    transform:rotate(-6deg);
  }
  .watermark img{width:100%;display:block;}

  .page{
    width:100%;
    max-width:440px;
    min-height:100dvh;
    padding: clamp(18px, 3.5vh, 32px) 24px 22px;
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
    z-index:1;
  }

  /* ---------- IDENTIDADE ---------- */
  .avatar-wrap{
    margin-top:8px;
    position:relative;
    width:128px;
    height:128px;
    opacity:0;
    animation: fadeIn 1.1s ease forwards 0.1s;
  }
  .avatar-ring{
    position:absolute;
    inset:-6px;
    border-radius:50%;
    border:1px solid var(--dourado);
    opacity:0.55;
  }
  .avatar{
    width:128px;
    height:128px;
    border-radius:50%;
    object-fit:cover;
    display:block;
    box-shadow: var(--sombra);
    border:3px solid var(--branco);
  }

  .avatar-badge{
    position:absolute;
    right:-4px;
    bottom:-4px;
    width:34px;
    height:34px;
    border-radius:50%;
    background:var(--branco);
    border:1.5px solid var(--dourado-claro);
    box-shadow: var(--sombra-suave);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:6px;
  }
  .avatar-badge img{ width:100%; height:100%; object-fit:contain; display:block; }

  .identity{
    margin-top:16px;
    text-align:center;
    opacity:0;
    animation: fadeUp 0.9s ease forwards 0.32s;
  }
  .name{
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-size:27px;
    letter-spacing:0.2px;
    color:var(--verde-escuro);
    line-height:1.15;
  }
  .role{
    margin-top:7px;
    font-size:11px;
    font-weight:600;
    letter-spacing:2.6px;
    text-transform:uppercase;
    color:var(--dourado);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .role::before{
    content:"";
    width:5px;
    height:5px;
    border-radius:50%;
    background:var(--dourado);
    flex-shrink:0;
  }

  .desc{
    margin-top:12px;
    font-size:14px;
    line-height:1.55;
    color:var(--texto-suave);
    max-width:320px;
    font-weight:300;
  }

  .locale{
    margin-top:12px;
    font-size:12px;
    color:var(--texto-suave);
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--branco);
    padding:6px 13px;
    border-radius:999px;
    box-shadow: var(--sombra-suave);
    opacity:0;
    animation: fadeUp 0.9s ease forwards 0.48s;
  }
  .locale svg{width:12px;height:12px;flex-shrink:0;}

  /* ---------- CTAs ---------- */
  .cta-group{
    width:100%;
    margin-top:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    padding:15px 20px;
    border-radius:16px;
    font-family:'Poppins',sans-serif;
    font-size:15.5px;
    font-weight:500;
    text-decoration:none;
    border:none;
    cursor:pointer;
    transition: transform 0.25s cubic-bezier(.2,.8,.2,1), box-shadow 0.25s ease, background 0.25s ease;
    opacity:0;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{ transform:scale(0.98); }
  .btn:hover{ transform:scale(1.02); }

  .btn-primary{
    background: linear-gradient(180deg, #0E4A30 0%, #0B3D28 100%);
    color:var(--branco);
    box-shadow: 0 14px 28px -10px rgba(11,61,40,0.45);
    animation: fadeUp 0.9s ease forwards 0.62s;
    letter-spacing:0.2px;
  }
  .btn-primary:hover{ box-shadow: 0 18px 34px -10px rgba(11,61,40,0.55); }
  .btn-primary svg{width:19px;height:19px;}

  .btn-outline{
    background:var(--branco);
    color:var(--verde-escuro);
    border:1.4px solid var(--verde);
    box-shadow: var(--sombra-suave);
    animation: fadeUp 0.9s ease forwards 0.75s;
  }
  .btn-outline svg{width:15px;height:15px;}

  /* ---------- CARD ---------- */
  .card{
    width:100%;
    margin-top:14px;
    background:var(--branco);
    border-radius:20px;
    padding:18px 20px 6px;
    box-shadow: var(--sombra);
    border:1px solid #EFEBDF;
    opacity:0;
    animation: fadeUp 0.9s ease forwards 0.9s;
  }
  .card-title{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-weight:500;
    font-size:16px;
    color:var(--verde-escuro);
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .card-title svg{width:15px;height:15px;flex-shrink:0;}

  .care-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    padding:12px 4px;
    border-top:1px solid #F0EDE3;
    background:none;
    border-left:none;
    border-right:none;
    border-bottom:none;
    font-family:'Poppins',sans-serif;
    font-size:13.8px;
    color:var(--texto);
    text-align:left;
    cursor:pointer;
    transition: color 0.2s ease, padding-left 0.2s ease;
  }
  .care-item:hover{ color:var(--verde); padding-left:8px; }
  .care-item .chev{
    width:15px;height:15px;color:var(--dourado);flex-shrink:0;
    transition: transform 0.2s ease;
  }
  .care-item:hover .chev{ transform:translateX(3px); }
  .care-item span{display:flex;align-items:center;gap:10px;}
  .dot{width:5px;height:5px;border-radius:50%;background:var(--dourado);flex-shrink:0;}

  /* ---------- SOCIAL ---------- */
  .social-row{
    margin-top:16px;
    display:flex;
    align-items:center;
    gap:22px;
    opacity:0;
    animation: fadeIn 1s ease forwards 1.08s;
  }
  .icon-btn{
    width:38px;height:38px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:var(--verde);
    background:var(--branco);
    border:1px solid #EAE6D8;
    box-shadow: var(--sombra-suave);
    cursor:pointer;
    text-decoration:none;
    transition: transform 0.2s ease, border-color 0.2s ease;
  }
  .icon-btn:hover{ transform:scale(1.07); border-color:var(--dourado-claro); }
  .icon-btn svg{width:16px;height:16px;}

  .footer-note{
    margin-top:14px;
    font-size:10.5px;
    letter-spacing:0.5px;
    color:var(--texto);
    opacity:0;
    animation: fadeIn 1s ease forwards 1.18s;
  }

  .footer-logo{
    margin-top:10px;
    width:96px;
    height:auto;
    opacity:0;
    animation: fadeIn 1s ease forwards 1.18s;
  }

  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--verde-escuro);
    color:var(--branco);
    padding:11px 20px;
    border-radius:999px;
    font-size:12.5px;
    box-shadow:0 10px 30px -8px rgba(0,0,0,0.4);
    opacity:0;
    transition: opacity 0.3s ease, transform 0.3s ease;
    pointer-events:none;
    z-index:10;
    white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

  @media (max-height: 700px){
    .page{ padding-top:20px; }
    .avatar-wrap{ width:108px;height:108px; }
    .avatar{ width:108px;height:108px; }
    .name{ font-size:26px; }
  }
</style>
</head>
